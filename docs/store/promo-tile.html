<!doctype html>
<!--
  Chrome Web Store のプロモ画像の元 HTML。
  scripts/render-promo.mjs が Playwright で撮影して PNG にする。
    ?size=small   → 小プロモタイル 440×280（必須）
    ?size=marquee → マーキー 1400×560（任意）
  背景イラスト（art/hero-source.png）とアイコン（art/icon-source.png）は Codex（image_gen）で生成。
  日本語の文字は画像生成で崩れるため、ここで HTML として重ねる。
-->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=block" rel="stylesheet" />
  <style>
    :root { --w: 440px; --h: 280px; --u: 1px; }
    html[data-size="marquee"] { --w: 1400px; --h: 560px; --u: 2.6px; }
    html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
    body {
      position: relative;
      background: #1d4ed8 url("art/hero-source.png") right center / cover no-repeat;
      font-family: "M PLUS Rounded 1c", "Yu Gothic UI", Meiryo, sans-serif;
      color: #fff;
    }
    /* 文字を置く左側を少し暗くして読みやすくする */
    body::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(23, 37, 120, 0.55) 0%, rgba(23, 37, 120, 0.25) 45%, rgba(23, 37, 120, 0) 65%);
    }
    .copy { position: absolute; left: calc(26 * var(--u)); top: 50%; transform: translateY(-50%); }
    .icon { width: calc(52 * var(--u)); height: calc(52 * var(--u)); display: block; margin-bottom: calc(10 * var(--u));
      filter: drop-shadow(0 calc(3 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.3)); }
    .title {
      font-family: "Dela Gothic One", "Yu Gothic UI", sans-serif;
      font-size: calc(38 * var(--u)); line-height: 1.05; letter-spacing: 0.01em;
      transform: skewX(-8deg); transform-origin: left bottom;
      text-shadow:
        calc(3 * var(--u)) calc(3 * var(--u)) 0 #1e3a8a,
        0 0 calc(14 * var(--u)) rgba(250, 204, 21, 0.55);
      white-space: nowrap;
    }
    /* 小タイルは背景のフォームが文字に近いので、文字を詰めて左側をしっかり暗くする */
    html[data-size="small"] .title { font-size: 31px; }
    html[data-size="small"] body { background-position: 78% center; }
    html[data-size="small"] body::before {
      background: linear-gradient(90deg, rgba(23, 37, 120, 0.85) 0%, rgba(23, 37, 120, 0.7) 50%, rgba(23, 37, 120, 0.1) 75%);
    }
    .title .shun { color: #facc15; font-size: 1.3em; margin-left: 0.04em; }
    .sub { margin-top: calc(9 * var(--u)); font-size: calc(13.5 * var(--u)); font-weight: 800;
      text-shadow: 0 calc(1 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, 0.45); white-space: nowrap; }
    .badge {
      display: inline-block; margin-top: calc(12 * var(--u)); font-size: calc(10.5 * var(--u)); font-weight: 800;
      background: #fff; color: #1e3a8a; border-radius: 999px; padding: calc(5 * var(--u)) calc(11 * var(--u));
      box-shadow: 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.25);
    }
  </style>
  <script>
    document.documentElement.dataset.size = new URLSearchParams(location.search).get('size') || 'small';
  </script>
</head>
<body>
  <div class="copy">
    <img class="icon" src="../../public/icons/icon128.png" alt="" />
    <div class="title">フォーム入力・<span class="shun">瞬</span></div>
    <div class="sub">AI が項目を判別して、一瞬で自動入力。</div>
    <div class="badge">個人情報は端末の外に出しません</div>
  </div>
</body>
</html>
