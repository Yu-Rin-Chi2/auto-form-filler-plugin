name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e (best-effort)
    runs-on: ubuntu-latest
    # E2E は Playwright + 実 Chromium の起動に依存し、CI 環境差異で不安定になりやすいため、
    # 失敗しても必須チェックにはしない（レビュー指摘 A-3）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
