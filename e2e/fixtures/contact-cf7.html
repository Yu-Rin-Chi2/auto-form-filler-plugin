<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせ | 株式会社サンプル</title>
</head>
<body>
<form>
<label>お名前<input type="text" id="fx-0" name="your-name" placeholder="山田 太郎" required></label>
<label>フリガナ<input type="text" id="fx-1" name="your-kana" placeholder="ヤマダ タロウ" required></label>
<label>会社名<input type="text" id="fx-2" name="your-company"></label>
<label>部署名<input type="text" id="fx-3" name="your-department"></label>
<label>メールアドレス<input type="email" id="fx-4" name="your-email" required></label>
<label>電話番号<input type="tel" id="fx-5" name="your-tel"></label>
<label>お問い合わせ種別<select id="fx-6" name="your-subject" required><option value="製品について">製品について</option><option value="採用について">採用について</option><option value="その他">その他</option></select></label>
<label>お問い合わせ内容<textarea id="fx-7" name="your-message" required></textarea></label>
<label>プライバシーポリシーに同意する<input type="checkbox" id="fx-8" name="acceptance"></label>
</form>
</body>
</html>
