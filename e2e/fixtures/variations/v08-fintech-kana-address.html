<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>口座開設のお申し込み | サンプル証券</title>
</head>
<body>
<!--
  バリエーション 08: 金融機関の口座開設フォーム。住所と住所カナを別々に入れる。
  - 郵便番号は 1 欄・ハイフンなし・maxlength=7
  - 都道府県 select は「都・府・県」なしの表記（東京 / 大阪）
  - 住所（漢字）4 欄 + 住所カナ 4 欄
  - 生年月日は和暦表記のみの年 select（「平成2年」など）+ ゼロ埋めの月・日 select。
    和暦 select は要件 5.3 で「対応なし＝スキップ」と決めているため、年は空欄のまま（誤った年を選ばない）
-->
<h1>口座開設のお申し込み</h1>
<form action="#" onsubmit="return false">
  <h2>ご本人情報</h2>
  <div><label for="nm_sei">お名前（姓）</label><input type="text" id="nm_sei" name="nmSei" data-key="family_name" data-expect="鈴木"></div>
  <div><label for="nm_mei">お名前（名）</label><input type="text" id="nm_mei" name="nmMei" data-key="given_name" data-expect="一郎"></div>
  <div><label for="kn_sei">フリガナ（セイ）</label><input type="text" id="kn_sei" name="knSei" data-key="family_name_kana" data-expect="スズキ"></div>
  <div><label for="kn_mei">フリガナ（メイ）</label><input type="text" id="kn_mei" name="knMei" data-key="given_name_kana" data-expect="イチロウ"></div>
  <div>
    <span>生年月日</span>
    <select id="birth_era_year" name="birthYear" aria-label="生年月日（年）" data-key="birth_year" data-expect="">
      <option value="">年</option>
      <option value="1988">昭和63年</option>
      <option value="1989">平成元年</option>
      <option value="1990">平成2年</option>
      <option value="1991">平成3年</option>
    </select>
    <select id="birth_month" name="birthMonth" aria-label="生年月日（月）" data-key="birth_month" data-expect="01">
      <option value="">月</option>
      <option value="01">01</option><option value="02">02</option><option value="12">12</option>
    </select>
    <select id="birth_day" name="birthDay" aria-label="生年月日（日）" data-key="birth_day" data-expect="31">
      <option value="">日</option>
      <option value="01">01</option><option value="30">30</option><option value="31">31</option>
    </select>
  </div>

  <h2>ご住所</h2>
  <div><label for="post_no">郵便番号（ハイフンなし7桁）</label><input type="text" id="post_no" name="postNo" maxlength="7" data-key="postal_code" data-expect="1000001"></div>
  <div>
    <label for="pref_cd">都道府県</label>
    <select id="pref_cd" name="prefCd" data-key="prefecture" data-expect="東京">
      <option value="">選択</option>
      <option value="北海道">北海道</option>
      <option value="神奈川">神奈川</option>
      <option value="東京">東京</option>
      <option value="大阪">大阪</option>
    </select>
  </div>
  <div><label for="addr_city">市区町村</label><input type="text" id="addr_city" name="addrCity" data-key="city" data-expect="千代田区"></div>
  <div><label for="addr_town">町名・番地</label><input type="text" id="addr_town" name="addrTown" data-key="address_line1" data-expect="千代田9-9-9"></div>
  <div><label for="addr_bldg">建物名・部屋番号</label><input type="text" id="addr_bldg" name="addrBldg" data-key="address_line2" data-expect="イーツーイータワー505"></div>

  <h2>ご住所（フリガナ）</h2>
  <div><label for="kana_pref">都道府県（フリガナ）</label><input type="text" id="kana_pref" name="kanaPref" data-key="prefecture_kana" data-expect="トウキョウト"></div>
  <div><label for="kana_city">市区町村（フリガナ）</label><input type="text" id="kana_city" name="kanaCity" data-key="city_kana" data-expect="チヨダク"></div>
  <div><label for="kana_town">町名・番地（フリガナ）</label><input type="text" id="kana_town" name="kanaTown" data-key="address_line1_kana" data-expect="チヨダ9-9-9"></div>
  <div><label for="kana_bldg">建物名・部屋番号（フリガナ）</label><input type="text" id="kana_bldg" name="kanaBldg" data-key="address_line2_kana" data-expect="イーツーイータワー505"></div>

  <h2>ご職業</h2>
  <div>
    <label for="job">ご職業</label>
    <select id="job" name="job" data-expect="">
      <option value="">選択</option><option>会社員</option><option>自営業</option><option>学生</option>
    </select>
  </div>
  <div><label for="income">年収</label><input type="text" id="income" name="income" data-expect=""></div>
  <button type="submit">次へ</button>
</form>
</body>
</html>
